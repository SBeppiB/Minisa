name: Qdrant integration
on: [workflow_dispatch]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,api]"
      - run: python -m pytest -m integration -q
        env:
          UMEM_TEST_QDRANT_URL: http://localhost:6333
