[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-memory"
version = "0.1.0"
description = "Application-neutral persistent memory with SQLite and Qdrant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["qdrant-client>=1.12,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "ruff>=0.9"]

[project.scripts]
umem = "universal_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_memory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured real Qdrant server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
